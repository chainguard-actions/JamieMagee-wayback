name: Test basic URL submission
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: wayback
        uses: .
        with:
          url: 'https://example.com'
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.wayback.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on Wayback Machine availability,
          # but it should not crash with an unhandled error (outcome is success or failure, not cancelled)
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
      - name: Show outputs
        env:
          WAYBACK_URL: ${{ steps.wayback.outputs.wayback_url }}
          WAYBACK_URLS: ${{ steps.wayback.outputs.wayback_urls }}
        run: |
          echo "wayback_url: $WAYBACK_URL"
          echo "wayback_urls: $WAYBACK_URLS"
          echo "PASS: outputs displayed"
