name: Test skipFirstArchive option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: wayback
        uses: .
        with:
          url: 'https://example.com'
          skipFirstArchive: 'true'
          saveErrors: 'false'
        continue-on-error: true
      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.wayback.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
