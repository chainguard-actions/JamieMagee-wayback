name: Test with saveErrors disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://example.com'
          saveErrors: 'false'
          saveOutlinks: 'false'
          saveScreenshot: 'false'
        continue-on-error: true
      - name: Assert wayback_url format if set
        env:
          ACTUAL: ${{ steps.action.outputs.wayback_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "wayback_url: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but wayback_url is empty"
              exit 1
            fi
            if echo "$ACTUAL" | grep -q "web.archive.org"; then
              echo "PASS: wayback_url contains web.archive.org: $ACTUAL"
            else
              echo "FAIL: wayback_url does not contain web.archive.org: $ACTUAL"
              exit 1
            fi
          else
            echo "SKIP: action did not succeed (likely network unavailable in test environment), skipping output assertion"
          fi
