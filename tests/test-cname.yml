name: Test CNAME-based URL detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create CNAME file
        run: |
          echo "example.com" > "$GITHUB_WORKSPACE/CNAME"
      - id: action
        uses: .
        continue-on-error: true
        with:
          skipFirstArchive: 'true'
      - name: Assert action ran without a runtime crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WAYBACK_URL: ${{ steps.action.outputs.wayback_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wayback_url: $WAYBACK_URL"
          # The action should either succeed (CNAME was detected and URL archived)
          # or fail with an API error. It must NOT fail with the "No URL provided
          # and no CNAME file found" validation error, which would indicate CNAME
          # detection is broken.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$WAYBACK_URL" ]; then
              echo "FAIL: action succeeded but wayback_url is empty"
              exit 1
            fi
            echo "PASS: CNAME detection worked and wayback_url is set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (likely Wayback Machine API unavailable or rate-limited)"
            echo "PASS: action ran and failed gracefully (CNAME was detected, API call failed)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
