name: Test basic URL submission
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: 'https://example.com'
          skipFirstArchive: 'true'
      - name: Assert action ran without a runtime crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WAYBACK_URL: ${{ steps.action.outputs.wayback_url }}
          WAYBACK_URLS: ${{ steps.action.outputs.wayback_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wayback_url: $WAYBACK_URL"
          echo "wayback_urls: $WAYBACK_URLS"
          # The action should either succeed (outputs set) or fail with an
          # expected Wayback Machine API error (not a JS runtime crash).
          # A runtime crash would produce outcome=failure with no meaningful
          # error output. We accept both success and API-level failure here.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$WAYBACK_URL" ]; then
              echo "FAIL: action succeeded but wayback_url is empty"
              exit 1
            fi
            if [ -z "$WAYBACK_URLS" ]; then
              echo "FAIL: action succeeded but wayback_urls is empty"
              exit 1
            fi
            echo "PASS: wayback_url and wayback_urls are set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (likely Wayback Machine API unavailable or rate-limited)"
            echo "PASS: action ran and failed gracefully (not a runtime crash)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
