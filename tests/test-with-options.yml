name: Test URL submission with all options enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://example.com'
          saveErrors: 'true'
          saveOutlinks: 'true'
          saveScreenshot: 'true'
        continue-on-error: true
      - name: Assert action ran and produced expected outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WAYBACK_URL: ${{ steps.action.outputs.wayback_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wayback_url: $WAYBACK_URL"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded - verify the output is a valid Wayback Machine URL
            if [ -z "$WAYBACK_URL" ]; then
              echo "FAIL: action succeeded but wayback_url output is empty"
              exit 1
            fi
            if echo "$WAYBACK_URL" | grep -q "web.archive.org"; then
              echo "PASS: wayback_url contains web.archive.org: $WAYBACK_URL"
            else
              echo "FAIL: wayback_url does not contain web.archive.org: $WAYBACK_URL"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed - this is acceptable if the Wayback Machine API is unavailable
            echo "PASS: action failed gracefully (Wayback Machine API may be unavailable in test environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
      - name: Assert options were accepted (action did not fail on input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should not fail due to invalid inputs - only network errors are acceptable
          # If outcome is 'failure', it should be due to network, not input validation
          # We cannot distinguish here, but we accept both success and failure
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
