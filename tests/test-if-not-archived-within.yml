name: Test ifNotArchivedWithin input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://example.com'
          ifNotArchivedWithin: '1d'
          saveErrors: 'false'
          saveOutlinks: 'false'
          saveScreenshot: 'false'
          skipFirstArchive: 'true'
        continue-on-error: true
      - name: Assert action ran with ifNotArchivedWithin input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ifNotArchivedWithin input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
